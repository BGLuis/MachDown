<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; }
        body {
            width: 320px;
            min-height: 120px;
            padding: 0;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1b2636;
            color: #e2e8f0;
        }

        /* Header comum */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px 10px;
            border-bottom: 1px solid #2e4460;
        }
        .header h3 {
            margin: 0;
            font-size: 1rem;
            color: #7dd3fc;
            letter-spacing: 0.5px;
        }
        .icon-btn {
            background: transparent;
            border: 1px solid #3d5068;
            color: #94a3b8;
            padding: 4px 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.15s;
        }
        .icon-btn:hover { background: #243447; color: #7dd3fc; }

        /* Tela de configuração */
        #screen-setup { padding: 14px 16px; }
        .subtitle { font-size: 0.8rem; color: #64748b; margin: 0 0 12px 0; }
        label { display: block; font-size: 0.78rem; font-weight: 600; color: #94a3b8; margin-top: 10px; margin-bottom: 3px; }
        input {
            width: 100%; padding: 7px 10px;
            border: 1px solid #3d5068; border-radius: 5px;
            background: #243447; color: #e2e8f0; font-size: 0.85rem;
            outline: none; transition: border-color 0.15s;
        }
        input:focus { border-color: #7dd3fc; }
        .btn-primary {
            margin-top: 14px; width: 100%; padding: 9px;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: white; border: none; border-radius: 5px;
            cursor: pointer; font-weight: 600; font-size: 0.88rem;
            transition: opacity 0.15s;
        }
        .btn-primary:hover { opacity: 0.87; }
        #status { margin-top: 8px; font-size: 0.8rem; color: #4ade80; text-align: center; min-height: 18px; }

        /* Tela principal */
        #screen-main { display: none; padding: 12px 16px 14px; }
        .quick-actions { display: flex; flex-direction: column; gap: 8px; }
        .action-card {
            background: #243447; border: 1px solid #2e4460;
            border-radius: 7px; padding: 10px 14px;
            display: flex; align-items: center; gap: 10px;
        }
        .action-card .icon { font-size: 1.3rem; }
        .action-card .info { flex: 1; }
        .action-card .info strong { display: block; font-size: 0.88rem; color: #e2e8f0; }
        .action-card .info small { font-size: 0.76rem; color: #64748b; }
        .badge {
            display: inline-block; background: #0ea5e9;
            color: white; font-size: 0.7rem; font-weight: 700;
            padding: 2px 7px; border-radius: 10px;
        }
        #status-indicator {
            font-size: 0.78rem; color: #4ade80;
            padding: 4px 0 0 0; text-align: center;
        }
    </style>
</head>
<body>

    <!-- ===== TELA DE CONFIGURAÇÃO ===== -->
    <div id="screen-setup">
        <div class="header">
            <h3>MachDown</h3>
            <button class="icon-btn" id="btn-back" style="display:none" title="Voltar sem salvar">← Voltar</button>
        </div>
        <div style="padding: 14px 0 0">
            <p class="subtitle">Configure a conexão com seu servidor</p>
            <label>Server URL</label>
            <input type="text" id="server_url" placeholder="https://localhost:8888">

            <label>API Key</label>
            <input type="password" id="api_key" placeholder="Chave gerada no servidor">

            <label>Target Client ID</label>
            <div style="display:flex; gap: 8px;">
                <select id="client_id" style="flex:1; padding: 7px 10px; border: 1px solid #3d5068; border-radius: 5px; background: #243447; color: #e2e8f0; font-size: 0.85rem; outline: none;">
                    <option value="">Selecione...</option>
                </select>
            </div>
            
            <div style="margin-top: 14px; display: flex; align-items: center; justify-content: space-between;">
                <label style="margin: 0;">Interceptar Downloads Nativo</label>
                <input type="checkbox" id="intercept_enabled" style="width: auto;" checked>
            </div>

            <button class="btn-primary" id="save">Salvar e Conectar</button>
            <div id="status"></div>
        </div>
    </div>

    <!-- ===== TELA PRINCIPAL ===== -->
    <div id="screen-main">
        <div class="header">
            <h3>MachDown</h3>
            <button class="icon-btn" id="btn-settings" title="Configurações">⚙️</button>
        </div>
        <div class="quick-actions" style="margin-top: 12px;">
            <div class="action-card">
                <span class="icon">🖱️</span>
                <div class="info">
                    <strong>Download com 1 clique</strong>
                    <small>Clique direito em link → Enviar ao MachDown</small>
                </div>
            </div>

            <!-- Download Direto -->
            <div class="action-card" style="flex-direction: column; align-items: stretch; gap: 8px;">
                <div style="display:flex; justify-content:space-between;">
                    <strong>Download Direto</strong>
                </div>
                <div style="display:flex; gap: 8px;">
                    <input type="text" id="direct_url" placeholder="https://..." style="flex:1;">
                    <button class="icon-btn" id="btn-direct-download" title="Baixar">🚀</button>
                </div>
            </div>

            <!-- Lista de Downloads -->
            <div class="action-card" style="flex-direction: column; align-items: stretch; gap: 8px;">
                <div style="display:flex; justify-content:space-between;">
                    <strong>Downloads Recentes</strong>
                    <button class="icon-btn" id="btn-refresh-downloads" style="padding: 2px 5px;" title="Atualizar">🔄</button>
                </div>
                <ul id="ext-downloads-list" style="margin: 0; padding: 0; list-style: none; font-size: 0.8rem; max-height: 120px; overflow-y: auto;">
                    <li style="color:#64748b; text-align:center;">Carregando...</li>
                </ul>
            </div>
        </div>
        <div id="status-indicator" style="margin-top:10px;">✅ Conectado a <span id="display-server"></span></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
